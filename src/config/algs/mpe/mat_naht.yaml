# --- MAT-NAHT Configuration ---
name: "mat_naht"
on_policy: True
action_selector: "soft_policies"
mask_before_softmax: True

runner: "parallel"

# --- Hyperparameters (Standardized to 256 for fair comparison) ---
buffer_size: 64
batch_size_run: 8
batch_size: 64

save_extra_stats: False

obs_agent_id: True
obs_last_action: True
obs_state: False
obs_individual_obs: False
obs_team_composition: False

# --- Modules Selection ---
agent_output_type: "pi_logits"
learner: "mat_naht_learner"
mac: "agent_owned_mac"
agent: "mat_naht_agent"
critic_type: "mat_naht_critic"

ed_pretrain_ts: 0
ed_pretrain_epochs: 10 # 10000, 30
ed_grad_norm_clip: 0.5 #5
ed_model_uncontrolled_only: False

# --- MAT-NAHT Network Architecture Parameters ---
hidden_dim: 128
n_heads: 4
n_layers: 2
history_len: 5
dropout: 0.1

# --- PPO & Training Parameters (Standardized) ---
entropy_coef: 0.01 #0.03, 0.05
grad_norm_clip: 0.5
standardise_rewards: True
use_gae: True
gae_lambda: 0.95
q_nstep: 5
gamma: 0.99

epochs: 5
n_minibatch: 2
eps_clip: 0.2
lr: 0.0003
critic_lr: 0.0003
optim_alpha: 0.99
optim_eps: 0.00001

ed_epochs: 1
n_ed_minibatch: 2 # 1
n_ed_hidden_layers: 1
ed_hidden_dim: 128 # 64
embed_dim: 128 # 64
ed_lr: 0.003 # 0.001
ed_bce_loss: False

# --- Value & Normalization Settings ---
use_popart: False
clip_value_loss: True
use_huber_loss: True
huber_delta: 1.0
use_adv_std: True
use_obs_norm: True
use_orthogonal_init: True

# --- Masking & Open Train Parameters ---
trainable_agents_mask_actor: True
trainable_agents_mask_critic: False
mask_type: "team"

trained_agents:
  agent_0:
    agent_loader: mat_naht_train_agent_loader
    agent_path: ""